name: Build & Release VSIX

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to publish a Release for (manual builds only; tag pushes publish automatically)'
        required: false
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: darwin-arm64
          - os: ubuntu-22.04
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: windows-2022
            target: win32-x64
          # darwin-x64 / win32-arm64: GitHub has no hosted Intel macOS or
          # Windows ARM runners anymore. To publish them, add entries pointing
          # at self-hosted runners with those architectures.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # npm >= 11 gates install scripts behind an allow-list; the repo's
      # package.json carries the approved list (allowScripts), so npm ci runs
      # the native-module scripts (node, node-pty, koffi, …) on every platform.

      - name: Package VSIX
        run: npm run package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.target }}
          path: '*.vsix'
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    # Tag pushes publish automatically; manual dispatch publishes only when a
    # tag name is supplied, so `github.ref` (a branch) never creates a release.
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: vsix-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || inputs.tag_name }}
          files: artifacts/**/*.vsix
          generate_release_notes: true
